name: Agent S1/S2 repair verification

on:
  push:
    branches:
      - agent/fix-s1-s2-navigation-risks
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-s1-s2-repair-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.9.0

jobs:
  web:
    name: Web, types, package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reconstruct repair scripts and apply to pristine main
        shell: bash
        run: |
          set -euo pipefail
          for name in ts ios android ci hotfix; do
            cat ".github/agent/${name}.gz.b64."* | base64 -d | gzip -dc > "/tmp/agent_fix_${name}.py"
            python3 -m py_compile "/tmp/agent_fix_${name}.py"
          done
          git fetch origin main
          git reset --hard origin/main
          python3 /tmp/agent_fix_ts.py
          python3 /tmp/agent_fix_ios.py
          python3 /tmp/agent_fix_android.py
          python3 /tmp/agent_fix_ci.py
          python3 /tmp/agent_fix_hotfix.py
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run fmt
      - run: git diff --check
      - run: pnpm run verify:web

  android:
    name: Android unit and packed host
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reconstruct repair scripts and apply to pristine main
        shell: bash
        run: |
          set -euo pipefail
          for name in ts ios android ci hotfix; do
            cat ".github/agent/${name}.gz.b64."* | base64 -d | gzip -dc > "/tmp/agent_fix_${name}.py"
          done
          git fetch origin main
          git reset --hard origin/main
          python3 /tmp/agent_fix_ts.py
          python3 /tmp/agent_fix_ios.py
          python3 /tmp/agent_fix_android.py
          python3 /tmp/agent_fix_ci.py
          python3 /tmp/agent_fix_hotfix.py
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run fmt
      - run: git diff --check
      - name: Build library and run JVM tests
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew clean build test --no-daemon
      - name: Build packed plugin in a Capacitor host app
        run: bash scripts/verify-packed-host.sh android

  ios:
    name: iOS Swift, CocoaPods and SPM hosts
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reconstruct repair scripts and apply to pristine main
        shell: bash
        run: |
          set -euo pipefail
          for name in ts ios android ci hotfix; do
            cat ".github/agent/${name}.gz.b64."* | base64 -d | gzip -dc > "/tmp/agent_fix_${name}.py"
          done
          git fetch origin main
          git reset --hard origin/main
          python3 /tmp/agent_fix_ts.py
          python3 /tmp/agent_fix_ios.py
          python3 /tmp/agent_fix_android.py
          python3 /tmp/agent_fix_ci.py
          python3 /tmp/agent_fix_hotfix.py
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run fmt
      - run: git diff --check
      - name: Build Swift package
        run: xcodebuild -scheme CapacitorNativeNavigationBar -destination "generic/platform=iOS" build
      - name: Resolve simulator
        id: sim
        shell: bash
        run: |
          udid=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; data=json.load(sys.stdin)['devices']; runtimes=sorted((k for k in data if 'iOS' in k), reverse=True); print(next(d['udid'] for r in runtimes for d in data[r] if d['name'].startswith('iPhone')))" )
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run Swift tests
        run: xcodebuild test -scheme CapacitorNativeNavigationBar -destination "id=${{ steps.sim.outputs.udid }}"
      - name: Build packed plugin through CocoaPods host
        run: bash scripts/verify-packed-host.sh ios-cocoapods
      - name: Build packed plugin through SPM host
        run: bash scripts/verify-packed-host.sh ios-spm

  android-instrumentation:
    name: Android instrumentation API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 31]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reconstruct repair scripts and apply to pristine main
        shell: bash
        run: |
          set -euo pipefail
          for name in ts ios android ci hotfix; do
            cat ".github/agent/${name}.gz.b64."* | base64 -d | gzip -dc > "/tmp/agent_fix_${name}.py"
          done
          git fetch origin main
          git reset --hard origin/main
          python3 /tmp/agent_fix_ts.py
          python3 /tmp/agent_fix_ios.py
          python3 /tmp/agent_fix_android.py
          python3 /tmp/agent_fix_ci.py
          python3 /tmp/agent_fix_hotfix.py
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run fmt
      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd android
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest --no-daemon

  publish:
    name: Publish verified source to branch
    needs: [web, android, ios, android-instrumentation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reconstruct scripts before resetting the temporary payload commit
        shell: bash
        run: |
          set -euo pipefail
          for name in ts ios android ci hotfix; do
            cat ".github/agent/${name}.gz.b64."* | base64 -d | gzip -dc > "/tmp/agent_fix_${name}.py"
          done
          git fetch origin main
          git reset --hard origin/main
          python3 /tmp/agent_fix_ts.py
          python3 /tmp/agent_fix_ios.py
          python3 /tmp/agent_fix_android.py
          python3 /tmp/agent_fix_ci.py
          python3 /tmp/agent_fix_hotfix.py
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run fmt
      - run: git diff --check
      - name: Commit and replace temporary branch payload with verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve native navigation S1 and S2 risks"
          git push --force-with-lease origin HEAD:agent/fix-s1-s2-navigation-risks
