name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref so pushing a fixup does not queue
# behind, or race with, the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, test, build, package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      # Build against the declared Node.js floor instead of only the newest LTS.
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify formatting and show any required diff
        run: |
          pnpm run fmt
          git diff --exit-code
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run check:package

  ios:
    name: iOS (SPM build + Swift tests)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build (generic iOS destination)
        run: xcodebuild -scheme CapacitorNativeNavigationBar -destination "generic/platform=iOS" build
      - name: Resolve an available iOS Simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; data=json.load(sys.stdin)['devices']; \
              runtimes=sorted((key for key in data if 'iOS' in key), reverse=True); \
              print(next(device['udid'] for runtime in runtimes for device in data[runtime] if device['name'].startswith('iPhone')))")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run Swift unit tests
        run: xcodebuild test -scheme CapacitorNativeNavigationBar -destination "id=${{ steps.sim.outputs.udid }}"

  android:
    name: Android (standalone Gradle build + JUnit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm
      # Populates node_modules/@capacitor/android, which android/settings.gradle
      # includes as the ':capacitor-android' project.
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build Android library and run tests
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew clean build test --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-results
          path: android/build/test-results/**/*.xml
          if-no-files-found: ignore
