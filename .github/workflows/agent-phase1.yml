name: Apply S1/S2 phase 1

on:
  push:
    branches:
      - agent/fix-s1-s2-navigation-risks
    paths:
      - scripts/.agent-phase1-s1-s2.py
      - .github/workflows/agent-phase1.yml

permissions:
  contents: write

concurrency:
  group: agent-s1-s2-phase1
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-s1-s2-navigation-risks
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply state and validation fixes
        run: python3 scripts/.agent-phase1-s1-s2.py
      - name: Remove one-shot applicator
        run: rm -f scripts/.agent-phase1-s1-s2.py .github/workflows/agent-phase1.yml
      - name: Format and verify web layer
        run: |
          pnpm run fmt
          pnpm run lint
          pnpm run test
          pnpm run build
          pnpm run check:package
      - name: Commit verified phase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make navigation state updates transactional"
          git push origin HEAD:agent/fix-s1-s2-navigation-risks
