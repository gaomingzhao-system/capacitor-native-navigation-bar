name: Apply S1/S2 phase 2

on:
  push:
    branches:
      - agent/fix-s1-s2-navigation-risks
    paths:
      - scripts/.agent-phase2-s1-s2.py
      - .github/workflows/agent-phase2.yml

permissions:
  contents: write

concurrency:
  group: agent-s1-s2-phase2
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/fix-s1-s2-navigation-risks
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - name: Apply any pending web-state phase
        run: |
          if [ -f scripts/.agent-phase1-s1-s2.py ]; then
            python3 scripts/.agent-phase1-s1-s2.py
          fi
      - name: Apply native hardening phase
        run: python3 scripts/.agent-phase2-s1-s2.py
      - name: Normalize generated CI job indentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          marker = '\nandroid-instrumentation:\n'
          if marker in text:
              before, after = text.split(marker, 1)
              block = 'android-instrumentation:\n' + after
              block = '\n'.join(('  ' + line) if line else line for line in block.split('\n'))
              text = before + '\n' + block
              path.write_text(text)
          PY
      - name: Remove one-shot applicators
        run: |
          rm -f scripts/.agent-phase1-s1-s2.py scripts/.agent-phase2-s1-s2.py
          rm -f .github/workflows/agent-phase1.yml .github/workflows/agent-phase2.yml
      - name: Format and verify TypeScript package
        run: |
          pnpm run fmt
          pnpm run lint
          pnpm run test
          pnpm run build
          pnpm run check:package
      - name: Verify Android native code and tests
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew clean build test --no-daemon
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve native navigation S1 and S2 risks"
          git push origin HEAD:agent/fix-s1-s2-navigation-risks
