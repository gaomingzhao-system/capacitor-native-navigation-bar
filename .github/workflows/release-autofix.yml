name: One-time release autofix

on:
  push:
    branches:
      - agent/npm-release-readiness

permissions:
  contents: write

jobs:
  autofix:
    if: contains(github.event.head_commit.message, '[release-autofix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/npm-release-readiness
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply release corrections
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          # Standalone Android builds must give the included capacitor-android
          # project the same SDK floors as this library.
          gradle = Path("android/build.gradle")
          gradle_text = gradle.read_text()
          standalone_sdk_block = """// The plugin module is also the root project during standalone CI builds.\n// Publish the SDK values on the root so the included capacitor-android project\n// does not silently fall back to compileSdk/targetSdk 35 and minSdk 23.\nif (rootProject == project) {\n    rootProject.ext.compileSdkVersion = 36\n    rootProject.ext.targetSdkVersion = 36\n    rootProject.ext.minSdkVersion = 30\n}\n\n"""
          if standalone_sdk_block not in gradle_text:
              if not gradle_text.startswith("ext {\n"):
                  raise RuntimeError("android/build.gradle: unexpected header")
              gradle.write_text(standalone_sdk_block + gradle_text)

          replace_once(
              "android/src/main/java/app/nativenavigationbar/capacitor/NativeNavigationPlugin.java",
              """            } else if (value == JSONObject.NULL) {\n                if (!isNestedKey(key, nestedKeys)) {\n                    state.put(key, JSONObject.NULL);\n                }\n            } else if (value != null) {\n""",
              """            } else if (value == JSONObject.NULL) {\n                state.remove(key);\n            } else if (value != null) {\n""",
          )

          swift = "ios/Sources/NativeNavigationBarPlugin/NativeNavigationPlugin.swift"
          replace_once(
              swift,
              """private let nativeNavigationMaximumDurationMilliseconds = 60_000.0\nprivate let nativeNavigationMaximumLayoutDimension: CGFloat = 4_096\n""",
              """private let nativeNavigationMaximumDurationMilliseconds = 60_000.0\nprivate let nativeNavigationMaximumLayoutDimension: CGFloat = 4_096\nprivate let nativeNavigationMaximumDecodedSVGBytes = 256 * 1_024\nprivate let nativeNavigationMaximumBase64SVGCharacters =\n    ((nativeNavigationMaximumDecodedSVGBytes + 2) / 3) * 4 + 4\nprivate let nativeNavigationMaximumPercentEncodedSVGCharacters =\n    nativeNavigationMaximumDecodedSVGBytes * 3\n""",
          )
          replace_once(
              swift,
              """                tabBar.onSelect = { [weak self] _, item in\n                    self?.emitPluginEvent(\"tabSelect\", data: [\n                        \"id\": item.id,\n                        \"index\": item.sourceIndex,\n                        \"title\": item.title\n                    ])\n                }\n""",
              """                tabBar.onSelect = { [weak self] _, item in\n                    guard let self else { return }\n                    self.tabbarState[\"selectedId\"] = item.id\n                    self.emitPluginEvent(\"tabSelect\", data: [\n                        \"id\": item.id,\n                        \"index\": item.sourceIndex,\n                        \"title\": item.title\n                    ])\n                }\n""",
          )
          replace_once(
              swift,
              """        emitPluginEvent(\"tabSelect\", data: [\n            \"id\": tabIds[index],\n            \"index\": index,\n            \"title\": tabTitles[index]\n        ])\n""",
              """        tabbarState[\"selectedId\"] = tabIds[index]\n        emitPluginEvent(\"tabSelect\", data: [\n            \"id\": tabIds[index],\n            \"index\": index,\n            \"title\": tabTitles[index]\n        ])\n""",
          )
          replace_once(
              swift,
              """    private func inlineSVG(from value: String) -> String? {\n        let trimmed = value.trimmingCharacters(in: .whitespacesAndNewlines)\n        if trimmed.hasPrefix(\"<svg\") {\n            return trimmed\n        }\n        let prefix = \"data:image/svg+xml\"\n        guard trimmed.lowercased().hasPrefix(prefix),\n              let commaIndex = trimmed.firstIndex(of: \",\") else {\n            return nil\n        }\n        let payload = String(trimmed[trimmed.index(after: commaIndex)...])\n        if trimmed[..<commaIndex].contains(\";base64\") {\n            guard let data = Data(base64Encoded: payload) else {\n                return nil\n            }\n            return String(data: data, encoding: .utf8)\n        }\n        return payload.removingPercentEncoding\n    }\n""",
              """    private func inlineSVG(from value: String) -> String? {\n        let trimmed = value.trimmingCharacters(in: .whitespacesAndNewlines)\n        if trimmed.hasPrefix(\"<svg\") {\n            return trimmed\n        }\n        let prefix = \"data:image/svg+xml\"\n        guard trimmed.lowercased().hasPrefix(prefix),\n              let commaIndex = trimmed.firstIndex(of: \",\") else {\n            return nil\n        }\n        let payload = String(trimmed[trimmed.index(after: commaIndex)...])\n        if trimmed[..<commaIndex].lowercased().contains(\";base64\") {\n            guard payload.utf8.count <= nativeNavigationMaximumBase64SVGCharacters,\n                  let data = Data(base64Encoded: payload),\n                  data.count <= nativeNavigationMaximumDecodedSVGBytes else {\n                return nil\n            }\n            return String(data: data, encoding: .utf8)\n        }\n        guard payload.utf8.count <= nativeNavigationMaximumPercentEncodedSVGCharacters,\n              let decoded = payload.removingPercentEncoding,\n              decoded.utf8.count <= nativeNavigationMaximumDecodedSVGBytes else {\n            return nil\n        }\n        return decoded\n    }\n""",
          )

          swift_tests = "ios/Tests/NativeNavigationBarPluginTests/NativeNavigationTests.swift"
          for old, new in [
              ("CGSize(width: .infinity, height: 24)", "CGSize(width: CGFloat.infinity, height: 24)"),
              ("CGRect(x: .greatestFiniteMagnitude, y: 0, width: 100, height: 100)",
               "CGRect(x: CGFloat.greatestFiniteMagnitude, y: 0, width: 100, height: 100)"),
              ("CGRect(x: .infinity, y: 0, width: 100, height: 100)",
               "CGRect(x: CGFloat.infinity, y: 0, width: 100, height: 100)"),
          ]:
              replace_once(swift_tests, old, new)

          # The package has never been published under this npm name. Remove the
          # stale migration narrative and document 7.2.0 as the first release.
          readme = Path("README.md")
          readme_text = readme.read_text()
          readme_text = readme_text.replace(
              """Capacitor 8 support is **not** included in this release; see\n[Migrating from the 1.x / Capacitor 7+8 release](#migrating-from-the-1x--capacitor-78-release)\nbelow.\n""",
              """Version **7.2.0** is the first public npm release. The package major follows\nthe supported Capacitor major, so this release line supports Capacitor 7 only.\n""",
          )
          readme_text, count = re.subn(
              r"## Migrating from the 1\.x / Capacitor 7\+8 release\n.*?(?=## Technical comparison with)",
              """## Versioning\n\nVersion **7.2.0** is the first public release of\n`capacitor-native-navigation-bar` on npm. No earlier `1.x` or `2.x` package\nversion exists under this package name. The major version intentionally tracks\nthe supported Capacitor major: `7.x` releases support Capacitor 7, while future\nCapacitor 8 support will use a separate `8.x` release line.\n\n""",
              readme_text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError("README.md: stale migration section not found")
          readme.write_text(readme_text)

          readme_ja = Path("README.ja.md")
          ja_text = readme_ja.read_text()
          ja_text = ja_text.replace(
              """このリリースには Capacitor 8 サポートは **含まれていません**。詳細は\n[1.x / Capacitor 7+8 リリースからの移行](#1x--capacitor-78-リリースからの移行)\nを参照してください。\n""",
              """バージョン **7.2.0** が最初の npm 公開版です。パッケージのメジャー\nバージョンは対応する Capacitor のメジャーに合わせるため、このリリース系列は\nCapacitor 7 のみをサポートします。\n""",
          )
          ja_text, count = re.subn(
              r"## 1\.x / Capacitor 7\+8 リリースからの移行\n.*?(?=## \[`@capgo/capacitor-native-navigation`\])",
              """## バージョニング\n\nバージョン **7.2.0** は `capacitor-native-navigation-bar` の最初の npm 公開版です。\nこのパッケージ名では、以前の `1.x`・`2.x` 公開版は存在しません。メジャー\nバージョンは対応する Capacitor のメジャーに合わせます。`7.x` は Capacitor 7、\n将来の Capacitor 8 対応は別の `8.x` リリース系列として提供します。\n\n""",
              ja_text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError("README.ja.md: stale migration section not found")
          readme_ja.write_text(ja_text)

          for workflow in [Path(".github/workflows/ci.yml"), Path(".github/workflows/release.yml")]:
              text = workflow.read_text()
              replacements = {
                  "actions/checkout@v4": "actions/checkout@v7",
                  "actions/setup-node@v4": "actions/setup-node@v7",
                  "actions/setup-java@v4": "actions/setup-java@v5",
                  "actions/upload-artifact@v4": "actions/upload-artifact@v7",
                  "pnpm/action-setup@v4": "pnpm/action-setup@v6",
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              workflow.write_text(text)

          ci = Path(".github/workflows/ci.yml")
          ci_text = ci.read_text()
          replace_target = """      - run: pnpm install --frozen-lockfile\n      - run: pnpm run lint\n"""
          replace_value = """      - run: pnpm install --frozen-lockfile\n      - name: Verify formatting and show any required diff\n        run: |\n          pnpm run fmt\n          git diff --exit-code\n      - run: pnpm run lint\n"""
          if ci_text.count(replace_target) != 1:
              raise RuntimeError("ci.yml: Web install/lint sequence not found exactly once")
          ci.write_text(ci_text.replace(replace_target, replace_value, 1))
          PY
      - name: Format supported source files
        run: pnpm run fmt
      - name: Verify generated changes
        run: |
          git diff --check
          pnpm run lint
          pnpm run test
          pnpm run build
          pnpm run check:package
      - name: Commit corrected release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: resolve native and release validation failures"
          git push origin HEAD:agent/npm-release-readiness
