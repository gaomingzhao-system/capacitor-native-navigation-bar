ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.0'
    androidxCoreVersion = project.hasProperty('androidxCoreVersion') ? rootProject.ext.androidxCoreVersion : '1.13.1'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.2.1'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.6.1'
    // Only used when this module is built on its own (`cd android && ./gradlew build`).
    // Inside an app the app's own buildscript classpath wins, which is what this
    // library relies on when embedded in a Capacitor 7 app (AGP 8.7.x default).
    standaloneAgpVersion = project.hasProperty('androidGradlePluginVersion') ? rootProject.ext.androidGradlePluginVersion : '8.7.2'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:${project.hasProperty('androidGradlePluginVersion') ? rootProject.ext.androidGradlePluginVersion : '8.7.2'}"
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "app.nativenavigationbar.capacitor"
    // Follows the host app's compileSdk; the fallback (35) is Capacitor 7's own
    // default so a standalone build (`cd android && ./gradlew build`) matches it.
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
    defaultConfig {
        // Deliberately NOT `project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion
        // : 24` (the pattern every other version here follows). Verified empirically:
        // that pattern lets the *app's* lower value silently win whenever the app
        // declares one — which a Capacitor 7 app's `variables.gradle` always does
        // (default 23) — and neither Gradle nor the manifest merger raises any
        // error, because there is no longer an independent "the library requires
        // 24" signal once this module's own defaultConfig adopts 23 too. A plugin
        // AndroidManifest.xml `<uses-sdk minSdkVersion="24">` doesn't survive that
        // either: AGP regenerates the module's own merged manifest from
        // defaultConfig.minSdkVersion before merging it into the app, so it
        // overwrites a hand-written tag with the same conditional value.
        //
        // Hard-coding 24 here is what actually makes the floor enforceable: it is
        // this module's genuine, independent minSdk, so the manifest merger
        // correctly fails an app still on the Capacitor 7 template default of 23
        // with "uses-sdk:minSdkVersion 23 cannot be smaller than version 24
        // declared in library [...]" — verified by building this exact app both
        // ways. Everything newer than API 24 stays behind Build.VERSION.SDK_INT
        // checks regardless.
        minSdkVersion 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'proguard-rules.pro'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError = false
    }
    compileOptions {
        // Capacitor 7 and 8 both compile capacitor-android with Java 21 and both
        // require a JDK 21 toolchain, so 17 here is simply a lower, compatible
        // bytecode floor that also lets the module build on a JDK 17 toolchain.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    annotationProcessor project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // androidx.core.graphics.PathParser (used by the SVG icon renderer) is public
    // API from core 1.7.0 onward; declare it explicitly instead of relying on the
    // version appcompat happens to pull in.
    implementation "androidx.core:core:$androidxCoreVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
